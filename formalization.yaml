# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: v0.4
project:
  name: The five exponentials theorem
  description: The five exponentials theorem (Waldschmidt 1988, Corollary 2.2). If x₁, x₂ are linearly
    independent over ℚ, y₁, y₂ are linearly independent over ℚ, and η ≠ 0 is algebraic, then one of
    the five numbers exp (xᵢ yⱼ) and exp (η x₂ / x₁) is transcendental. This repository is a self-contained
    extract of this theorem from the library github.com/carlok/diaz-modulus-lean, which is the canonical
    home of the proofs.
  authors:
  - Carlo Perassi
  license: Apache-2.0
  responsible_maintainers:
  - Carlo Perassi
classification:
  arxiv:
  - math.NT
  - cs.LO
  msc2020:
  - 11J81
  - 11J86
  - 68V20
sources:
- title: On the transcendence methods of Gel'fond and Schneider in several variables
  authors:
  - Michel Waldschmidt
  type: book chapter
  location: New Advances in Transcendence Theory (Durham, 1986), Cambridge University Press, 1988,
    375–398, Corollary 2.2
  relationship: formalizes
  note: The five exponentials theorem as stated there.
  license: unknown
  author_endorsement: n/a
- title: Diophantine Approximation on Linear Algebraic Groups
  authors:
  - Michel Waldschmidt
  type: book
  location: Grundlehren der mathematischen Wissenschaften 326, Springer, 2000
  relationship: formalizes
  note: '§11.3.3 and the remark after Corollary 11.16: the formal proof derives the theorem from Roy''s
    strong six exponentials theorem and Baker''s theorem, both proved in the library.'
  license: unknown
  author_endorsement: n/a
- title: Matrices whose coefficients are linear forms in logarithms
  authors:
  - Damien Roy
  type: paper
  location: Journal of Number Theory 41 (1992), 22–47
  relationship: background
  note: Roy's strong six exponentials theorem (Corollary 2), proved in the import closure.
  license: unknown
  author_endorsement: n/a
related_formalizations:
- id: https://github.com/carlok/diaz-modulus-lean
  relationship: other
  note: The canonical home of these proofs, by the same author, and of a wider library on Diaz's conjecture.
    This repository copies the import closure of the compared theorems (136 modules, at commit 465147a3ec8bec43ad0046c1f3ccdfc41afc88cf)
    with only the changes the Lean module system needs, so that they can be checked on their own.
    The module paths and namespaces are those of the library. Corrections are made there first.
- id: https://github.com/leanprover-community/mathlib4/pull/28013
  relationship: other
  note: The module Diaz.LindemannWeierstrass in this extract is ported from this unmerged Mathlib
    pull request (Lindemann–Weierstrass), with credit to its authors. It lies in the import closure
    through Diaz.Axioms; the compared theorems are not taken from it.
- id: https://palomar-registry.org/entry?id=PALOMAR-2026-11-22-000020&version=1
  relationship: other
  note: The six exponentials theorem from the same library, registered separately by the same author
    on 2026-11-22. It is not compared again here.
status:
  scope: 'Formalized and compared: FiveExponentials.five_exponentials (Waldschmidt 1988, Corollary
    2.2; Waldschmidt 2000, §11.3.3). Not formalized: The sharp six exponentials theorem; the strong
    five exponentials conjecture.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: FiveExponentials.five_exponentials
    file: Solution.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - declaration: Diaz.five_exponentials
    file: Diaz/Mirror/five_exponentials.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - Claude (Anthropic); the model version was not recorded per proof
    framework: Claude Code
    tool_setup: Claude agents (Anthropic) wrote the Lean statements and proofs under Carlo Perassi's
      direction, one statement at a time, and submitted them to the Prove2Me platform (https://prove2.me),
      which checked and accepted them. They were then mirrored into diaz-modulus-lean. The proofs
      use ordinary Mathlib tactics and terms; there is no native_decide.
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: local machine
    prompting_notes: not recorded
  - method: agent
    models:
    - Claude Opus 5.5
    framework: Claude Code
    tool_setup: 'A Claude agent made this extract under Carlo Perassi''s direction: it copied the
      136 modules of the import closure from diaz-modulus-lean, made the module-system changes, and
      wrote Challenge.lean, Solution.lean, this file, the README and the CI workflow.'
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: cloud workspace
    prompting_notes: not recorded
  spend_usd: not tracked
  notes: 'The Lean code and the texts in this repository were written by Claude agents (Anthropic)
    under the direction of Carlo Perassi, who is responsible for them. No claim rests on an assertion
    by a language model: the proofs are checked by Lean''s kernel at the pinned toolchain, and the
    axioms of the compared theorems are audited in CI.'
fidelity:
  divergences: None known. Each Challenge statement is written with Mathlib's notions only. x 0, x
    1 are x₁, x₂ and y 0, y 1 are y₁, y₂. The conclusion is the negation of "all four exp (x i * y
    j) and exp (η * x 1 / x 0) are algebraic". The compared theorems live in the namespace FiveExponentials
    and the library theorems keep their library names; the statements are the same up to unfolding
    the library's abbreviations.
review:
  status: machine-checked; no human expert review of the Lean
  reviewers: []
  notes: 'Checks made: the Prove2Me platform checked and accepted the proofs when they were first
    submitted, and diaz-modulus-lean builds them in CI with leanprover/lean4:v4.36.0 and Mathlib v4.36.0.
    This repository''s CI builds the extract, audits the axioms with #print axioms, and runs the toolchain''s
    lake comparator. No mathematician has reviewed the Lean code, and the Challenge statements have
    not been reviewed against the sources by anyone independent of their authors.'
alignment:
  namespace: FiveExponentials
  statements:
  - source: Waldschmidt 1988, Corollary 2.2; Waldschmidt 2000, §11.3.3
    lean: FiveExponentials.five_exponentials
    module: Challenge
    status: proved
    note: Proved by the library theorem Diaz.five_exponentials.
acknowledgements: 'The Mathlib community, for Lean 4 and Mathlib; the authors of Mathlib pull request
  #28013 (Lindemann–Weierstrass), whose code is ported in the library; and the Prove2Me platform,
  where the proofs were first submitted and checked.'
